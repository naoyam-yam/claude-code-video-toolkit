# PORTABLE TEMPLATE — see ci.yml header comment. Move to repo-root .github/ to activate.
name: Screenshots

on:
  pull_request:
    paths:
      - "hokiru-web/**"
  workflow_dispatch: {}

jobs:
  screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hokiru-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hokiru-web/package-lock.json

      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run screenshots
        env:
          BASE_URL: ${{ vars.VERCEL_PREVIEW_URL || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: hokiru-web-screenshots
          path: hokiru-web/screenshots/output/
          retention-days: 14

      - name: Comment artifact location on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "📸 Screenshots uploaded as the `hokiru-web-screenshots` artifact on this run.",
            });
