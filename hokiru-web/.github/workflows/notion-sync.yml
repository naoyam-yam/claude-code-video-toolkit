# PORTABLE TEMPLATE — see ci.yml header comment. Move to repo-root .github/ to activate.
name: Notion Sync

on:
  push:
    branches: [main]
    paths:
      - "hokiru-web/**"
  workflow_dispatch: {}

jobs:
  notion-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hokiru-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hokiru-web/package-lock.json

      - run: npm install
      - run: npm run notion:draft
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_STRATEGY_PAGE_ID: ${{ secrets.NOTION_STRATEGY_PAGE_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: notion-update-draft
          path: hokiru-web/docs/operations/notion-update-draft.md
          retention-days: 30
