# PORTABLE TEMPLATE — this file lives at hokiru-web/.github/workflows/ci.yml and will
# NOT run here: GitHub Actions only reads workflows from the repository root's
# .github/workflows/. This repo (claude-code-video-toolkit) already has its own
# .github/workflows for its own CI. When HOKIRU Web is split into its own repository
# (see hokiru-web/README.md), copy this directory to that repo's root .github/.
name: CI

on:
  pull_request:
    paths:
      - "hokiru-web/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hokiru-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hokiru-web/package-lock.json

      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: true
